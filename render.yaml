services:
  - type: web
    name: frontdeskwise-api
    runtime: node
    region: virginia
    rootDir: apps/api
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: FRONTDESKWISE_DATABASE_NAME
        value: frontdeskwise
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DATABASE_SSL_CA_FILE
        value: /etc/secrets/rds-ca.pem
      - key: FRONTDESKWISE_CREDENTIAL_KEY
        sync: false
      - key: WEB_ORIGIN
        value: https://frontdeskwise.com,https://www.frontdeskwise.com,https://app.frontdeskwise.com
      - key: FRONTDESKWISE_PUBLIC_API_ORIGIN
        value: https://api.frontdeskwise.com
      - key: FRONTDESKWISE_WIDGET_ORIGIN
        value: https://frontdeskwise.com
      - key: FRONTDESKWISE_WIDGET_URL
        value: https://frontdeskwise.com/widget.js
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER_MONTHLY
        sync: false
      - key: STRIPE_PRICE_GROWTH_MONTHLY
        sync: false
      - key: STRIPE_PRICE_MULTI_BUSINESS_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PORTFOLIO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_STARTER_YEARLY
        sync: false
      - key: STRIPE_PRICE_GROWTH_YEARLY
        sync: false
      - key: STRIPE_PRICE_MULTI_BUSINESS_YEARLY
        sync: false
      - key: STRIPE_PRICE_PORTFOLIO_YEARLY
        sync: false
      - key: FRONTDESKWISE_STRIPE_SUCCESS_URL
        value: https://frontdeskwise.com/?billing=success
      - key: FRONTDESKWISE_STRIPE_CANCEL_URL
        value: https://frontdeskwise.com/?billing=cancel
      - key: FRONTDESKWISE_STRIPE_PORTAL_RETURN_URL
        value: https://frontdeskwise.com/?billing=portal
      - key: FRONTDESKWISE_DEFAULT_TRIAL_DAYS
        value: "14"
      - key: FRONTDESKWISE_SUPER_ADMIN_EMAILS
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: FRONTDESKWISE_S3_BUCKET
        sync: false
      - key: FRONTDESKWISE_MAX_DOCUMENT_BYTES
        value: "26214400"
      - key: FRONTDESKWISE_SES_FROM_EMAIL
        value: hello@frontdeskwise.com
      - key: FRONTDESKWISE_SES_FROM_NAME
        value: FrontDeskWise
      - key: FRONTDESKWISE_SES_REPLY_TO
        value: hello@frontdeskwise.com
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: FRONTDESKWISE_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: FRONTDESKWISE_RATE_LIMIT_MAX
        value: "120"
      - key: FRONTDESKWISE_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: FRONTDESKWISE_DEMO_RATE_LIMIT_MAX
        value: "10"
      - key: FRONTDESKWISE_DEMO_RATE_LIMIT_WINDOW_MS
        value: "3600000"
